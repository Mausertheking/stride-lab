<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}</style>
<title>Stride Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=Manrope:wght@400;500;600;700&display=swap">
<style>
/* Stride Lab: ink, ivory and champagne gold. One column of step cards built for one-handed phone use. Both fonts carry Cyrillic. */
:root{
  --bg:#F3EFE7; --bg2:#ECE5D8; --surface:#FFFDF8; --surface2:#F4EEE3; --ink:#17140F; --muted:#6A6152; --line:#E1D7C5; --line2:#CDBFA6;
  --gold:#9C7637; --gold-soft:#C9A867; --gold-wash:rgba(176,138,72,.10);
  --btn:#17140F; --btn-ink:#F3E3C0;
  --good:#2F6B47; --good-bg:#E4EFE5; --warn:#8A5A12; --warn-bg:#F6EAD2; --bad:#9E2F25; --bad-bg:#F6E1DC;
  --video-bg:#0B0A08;
  --shadow:0 1px 0 rgba(255,255,255,.7) inset,0 18px 40px -28px rgba(40,28,10,.35);
  --f-display:'Cormorant Garamond','Iowan Old Style',Georgia,serif;
  --f-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0B0A08; --bg2:#12100C; --surface:#15130F; --surface2:#1D1A15; --ink:#F2ECE1; --muted:#A69C8B; --line:#2C2720; --line2:#40382C;
    --gold:#D8B97E; --gold-soft:#B8975A; --gold-wash:rgba(216,185,126,.08);
    --btn:#D8B97E; --btn-ink:#15110A;
    --good:#7CC59A; --good-bg:#16271C; --warn:#E3B566; --warn-bg:#2E2412; --bad:#EE8F83; --bad-bg:#341815;
    --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 24px 50px -30px rgba(0,0,0,.8);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0B0A08; --bg2:#12100C; --surface:#15130F; --surface2:#1D1A15; --ink:#F2ECE1; --muted:#A69C8B; --line:#2C2720; --line2:#40382C;
  --gold:#D8B97E; --gold-soft:#B8975A; --gold-wash:rgba(216,185,126,.08);
  --btn:#D8B97E; --btn-ink:#15110A;
  --good:#7CC59A; --good-bg:#16271C; --warn:#E3B566; --warn-bg:#2E2412; --bad:#EE8F83; --bad-bg:#341815;
  --shadow:0 1px 0 rgba(255,255,255,.03) inset,0 24px 50px -30px rgba(0,0,0,.8);
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  background:radial-gradient(120% 60% at 50% -10%,var(--bg2),var(--bg) 60%) fixed,var(--bg);
  color:var(--ink); font:400 16px/1.55 var(--f-body);
  padding-block:28px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.page{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3,h4{font-family:var(--f-display);margin:0;text-wrap:balance;font-weight:600}
h1{font-size:clamp(2.8rem,9vw,4.2rem);line-height:.9;letter-spacing:-.01em}
h1 em{font-style:italic;font-weight:500;color:var(--gold)}
h2{font-size:clamp(1.7rem,5vw,2.1rem);line-height:1.05}
h3{font-size:1.35rem;line-height:1.1}
h4{font-size:1.2rem;line-height:1.15}
p{margin:0}
.muted{color:var(--muted);font-size:.9rem}
.num{font-variant-numeric:tabular-nums lining-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
a{color:var(--gold);text-underline-offset:3px}

/* header */
.top{padding:6px 2px 4px;display:flex;flex-direction:column;gap:14px}
.toprow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font:600 .72rem/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--muted)}
.mono{width:34px;height:34px;border-radius:50%;border:1px solid var(--gold-soft);display:grid;place-items:center;font:600 italic 1.05rem/1 var(--f-display);letter-spacing:0;color:var(--gold);text-transform:none}
.lede{color:var(--muted);max-width:58ch;font-size:1.02rem}
.specs{display:flex;flex-wrap:wrap;gap:8px;list-style:none;margin:0;padding:0}
.specs li{font:600 .72rem/1 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);padding:8px 12px;border:1px solid var(--line2);border-radius:999px;background:var(--surface)}
.specs li::before{content:'';display:inline-block;width:5px;height:5px;border-radius:50%;background:var(--gold);margin-right:8px;vertical-align:2px}
.lanes{height:7px;border-top:1px solid var(--gold-soft);border-bottom:1px solid var(--gold-soft);opacity:.8}

/* cards */
.card{
  position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:22px 20px;
  display:flex;flex-direction:column;gap:16px;min-width:0;box-shadow:var(--shadow);
}
.card::before{content:'';position:absolute;left:20px;right:20px;top:-1px;height:1px;background:linear-gradient(90deg,transparent,var(--gold-soft),transparent);opacity:.9}
.eyebrow{display:flex;align-items:center;gap:10px;font:700 .7rem/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--gold)}
.eyebrow::after{content:'';flex:1;height:1px;background:var(--line)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}

/* controls */
.btn{
  font:600 .9rem/1.1 var(--f-body); letter-spacing:.01em; min-height:44px; padding:0 18px; border-radius:999px;
  border:1px solid var(--line2); background:var(--surface); color:var(--ink); cursor:pointer;
  display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,border-color .15s,transform .1s;
}
.btn:hover:not(:disabled){border-color:var(--gold-soft)}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.primary{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
.btn.gold{background:linear-gradient(180deg,#E2C68C,#C49E5A);border-color:#B48D4B;color:#1A140A}
.btn.lg{min-height:52px;padding:0 22px;font-size:.98rem}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn .spark{font-size:1rem;line-height:1}
.btn:focus-visible,.seg button:focus-visible,select:focus-visible,input:focus-visible,.link:focus-visible,summary:focus-visible,a:focus-visible,label.btn:focus-within{outline:2px solid var(--gold);outline-offset:3px}
.link{background:none;border:0;padding:6px 0;color:var(--gold);font:700 .82rem var(--f-body);letter-spacing:.02em;cursor:pointer}
.setup{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:16px}
.field{display:flex;flex-direction:column;gap:7px;min-width:0}
.field>span,.field>label,.lbl{font:700 .68rem/1.2 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.seg{display:flex;border:1px solid var(--line2);border-radius:999px;overflow:hidden;background:var(--surface2);padding:3px;gap:3px}
.seg button{flex:1;min-height:38px;padding:0 10px;border:0;border-radius:999px;background:transparent;color:var(--ink);font:500 .86rem/1.15 var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--btn);color:var(--btn-ink);font-weight:700}
.langseg{flex:none;width:auto}
.langseg button{min-width:44px;flex:none;min-height:32px;font-size:.78rem;letter-spacing:.08em}
select,input[type=password],input[type=text]{min-height:44px;border-radius:12px;border:1px solid var(--line2);background:var(--surface2);color:var(--ink);font:500 .92rem var(--f-body);padding:0 12px;min-width:0}
input[type=password],input[type=text]{flex:1 1 200px}
.tick{display:flex;gap:10px;align-items:flex-start;font-size:.92rem;cursor:pointer}
.tick input{width:18px;height:18px;margin:2px 0 0;accent-color:var(--gold);flex:none}
.tips{margin:0;padding:0;list-style:none;color:var(--muted);font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.tips li{padding-left:18px;position:relative}
.tips li::before{content:'';position:absolute;left:2px;top:.62em;width:8px;height:1px;background:var(--gold)}

/* Gemini panel */
.gem{border:1px solid var(--line2);border-radius:16px;background:linear-gradient(180deg,var(--gold-wash),transparent 70%);padding:0 16px}
.gem summary{min-height:56px;display:flex;align-items:center;justify-content:space-between;gap:10px;cursor:pointer;list-style:none;font:600 1.3rem var(--f-display)}
.gem summary::-webkit-details-marker{display:none}
.gem summary .g{display:flex;align-items:center;gap:10px}
.gem summary .g::before{content:'✦';font-size:1rem;color:var(--gold)}
.gem[open] summary{border-bottom:1px solid var(--line)}
.gembody{display:flex;flex-direction:column;gap:14px;padding:14px 0 16px}

/* stage */
.stage{background:var(--video-bg);border-radius:16px;overflow:hidden;min-height:200px;display:grid;place-items:center;position:relative;box-shadow:0 0 0 1px rgba(216,185,126,.18) inset}
.stage canvas{display:block;width:auto;height:auto;max-width:100%;max-height:68vh;touch-action:none;cursor:crosshair}
.stage.busy canvas{pointer-events:none}
.stage .empty{color:#B9AE9A;padding:40px 22px;text-align:center;max-width:36ch;font-size:.95rem}
#video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.mstat{display:flex;gap:10px;align-items:flex-start;font-size:.88rem;padding:10px 14px;border-radius:12px;background:var(--surface2);color:var(--muted)}
.mstat i{flex:none;width:8px;height:8px;border-radius:50%;margin-top:7px;background:var(--muted)}
.mstat[data-s="ready"] i,.mstat[data-s="found"] i{background:var(--good)}
.mstat[data-s="gem"] i{background:var(--gold);box-shadow:0 0 0 3px var(--gold-wash)}
.mstat[data-s="none"] i{background:var(--warn)}
.mstat[data-s="failed"] i{background:var(--bad)}
.mstat[data-s="loading"] i{background:var(--gold)}
.autobar{display:flex;gap:10px;flex-wrap:wrap}
.autobar .btn{flex:1 1 220px}
.prog{border:1px solid var(--line2);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface2)}
.prog-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-size:.9rem}
.prog[data-tone="good"]{border-color:color-mix(in srgb,var(--good) 40%,var(--line2))}
.prog[data-tone="warn"]{border-color:color-mix(in srgb,var(--warn) 45%,var(--line2))}
.prog[data-tone="bad"]{border-color:color-mix(in srgb,var(--bad) 45%,var(--line2))}
.track{height:4px;border-radius:4px;background:var(--line);overflow:hidden;position:relative}
.track i{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,var(--gold-soft),var(--gold));border-radius:4px;transition:width .2s}
.track.ind i{width:30%;animation:ind 1.2s ease-in-out infinite}
@keyframes ind{0%{left:-30%}100%{left:100%}}
.transport{display:flex;gap:6px;flex-wrap:wrap}
.transport .btn{flex:1 1 56px;padding:0 8px}
input[type=range]{width:100%;accent-color:var(--gold);height:32px;margin:0}
.readout{display:flex;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--muted);flex-wrap:wrap}
.readout b{color:var(--ink);font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0}
.chips li{display:flex;gap:7px;align-items:center;padding:5px 12px 5px 5px;border-radius:999px;border:1px solid var(--line);font-size:.84rem;color:var(--muted)}
.chips li span{display:grid;place-items:center;width:22px;height:22px;border-radius:50%;background:var(--surface2);font-size:.74rem;font-weight:700}
.chips li.done{color:var(--ink);background:var(--surface2)}
.chips li.done span{background:var(--btn);color:var(--btn-ink)}
.chips li.next{border-color:var(--gold-soft);color:var(--ink);font-weight:600}
.hint{font-size:.94rem}
.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(104px,1fr));gap:8px;margin:0}
.metrics div{background:var(--surface2);border:1px solid var(--line);border-radius:14px;padding:10px 12px;min-width:0}
.metrics dt{font:700 .64rem/1.2 var(--f-body);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.metrics dd{margin:4px 0 0;font:600 1.75rem/1 var(--f-display);font-variant-numeric:tabular-nums lining-nums}
.metrics dd small{font:500 .78rem var(--f-body);color:var(--muted);margin-left:2px}

/* kinogram */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:14px}
.pose{margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.imgwrap{position:relative;border-radius:14px;overflow:hidden;background:var(--video-bg);aspect-ratio:3/4;box-shadow:0 0 0 1px rgba(216,185,126,.2) inset}
.imgwrap img{display:block;width:100%;height:100%;object-fit:cover}
.tag{position:absolute;left:8px;top:8px;width:fit-content;max-width:calc(100% - 16px);background:rgba(11,10,8,.78);color:#F2E4C4;font:700 .64rem/1.1 var(--f-body);letter-spacing:.14em;text-transform:uppercase;padding:6px 8px;border-radius:999px;border:1px solid rgba(216,185,126,.35)}
.src{position:absolute;right:8px;bottom:8px;background:rgba(11,10,8,.72);color:#D8B97E;font:600 .62rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:5px 7px;border-radius:999px}
.pose .row{justify-content:space-between;gap:6px}
.mini{display:grid;grid-template-columns:minmax(0,1fr);gap:4px;margin:0;font-size:.84rem}
.mini div{display:flex;justify-content:space-between;gap:6px;min-width:0;border-bottom:1px dotted var(--line);padding-bottom:3px}
.mini dt{color:var(--muted)}
.mini dd{margin:0;font-weight:600;font-variant-numeric:tabular-nums}
.empty-note{background:var(--surface2);border:1px dashed var(--line2);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;align-items:flex-start}

/* report */
.summary{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.summary .big{font:600 3.2rem/1 var(--f-display);font-variant-numeric:lining-nums tabular-nums}
.group{display:flex;flex-direction:column;gap:12px}
.check{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:6px;min-width:0;background:var(--surface)}
.check header{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.pill{flex:none;font:700 .68rem/1 var(--f-body);letter-spacing:.1em;text-transform:uppercase;padding:6px 10px;border-radius:999px}
.pill.good{background:var(--good-bg);color:var(--good)}
.pill.ok{background:var(--warn-bg);color:var(--warn)}
.pill.work{background:var(--bad-bg);color:var(--bad)}
.pill.on{background:var(--good-bg);color:var(--good)}
.pill.off{background:var(--surface2);color:var(--muted);border:1px solid var(--line2)}
.check .ctx{font-size:.8rem;color:var(--muted)}
.check .cue{font-size:.95rem}
.check .drill{font-size:.88rem;color:var(--muted)}
.rhythm{display:flex;flex-direction:column;gap:10px}

/* coach */
.coach{border-radius:18px;padding:18px;display:flex;flex-direction:column;gap:14px;
  background:linear-gradient(160deg,#1B1813,#0E0C09);color:#EFE7D8;border:1px solid rgba(216,185,126,.28)}
.coach h3{color:#F4E6C6;display:flex;align-items:center;gap:10px}
.coach h3::before{content:'✦';font-size:1rem;color:#D8B97E}
.coach .muted{color:#ADA290}
.coach .lbl{color:#C9AE78}
.coach .quote{font:500 italic 1.35rem/1.35 var(--f-display);color:#F7EEDC}
.coach ol{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px;counter-reset:p}
.coach ol li{counter-increment:p;border:1px solid rgba(216,185,126,.2);border-radius:14px;padding:12px 14px 12px 50px;position:relative;background:rgba(255,255,255,.02)}
.coach ol li::before{content:counter(p);position:absolute;left:14px;top:12px;width:24px;height:24px;border-radius:50%;border:1px solid #D8B97E;color:#D8B97E;display:grid;place-items:center;font:600 .9rem/1 var(--f-display)}
.coach ol b{display:block;font:600 1.15rem/1.2 var(--f-display);color:#F4E6C6;margin-bottom:4px}
.coach ol p{font-size:.92rem}
.coach ol p+p{margin-top:4px}
.coach ul{margin:0;padding-left:18px;font-size:.92rem;display:flex;flex-direction:column;gap:4px}
.coach .btn{border-color:rgba(216,185,126,.4);background:transparent;color:#F2E4C4}
.coach .btn.gold{background:linear-gradient(180deg,#E2C68C,#C49E5A);color:#1A140A;border-color:#B48D4B}
.coach .err{color:#F0A397;font-size:.9rem}

details.ref{border:1px solid var(--line);border-radius:14px;padding:0 14px}
details.ref summary{min-height:52px;display:flex;align-items:center;cursor:pointer;font:600 1.25rem var(--f-display)}
details.ref[open] summary{border-bottom:1px solid var(--line)}
details.ref ul{margin:0;padding:12px 0 14px 18px;display:flex;flex-direction:column;gap:8px;font-size:.94rem}
#toast{
  position:fixed;left:max(16px,env(safe-area-inset-left,0px));right:max(16px,env(safe-area-inset-right,0px));
  bottom:calc(16px + env(safe-area-inset-bottom,0px));margin:0 auto;max-width:420px;z-index:20;
  background:#15130F;color:#F2E4C4;border:1px solid rgba(216,185,126,.35);border-radius:14px;padding:12px 16px;font-size:.9rem;
  opacity:0;transform:translateY(8px);pointer-events:none;transition:opacity .2s,transform .2s;
}
#toast.show{opacity:1;transform:none}
.foot{font-size:.82rem;color:var(--muted);padding:0 2px;text-align:center;max-width:62ch;margin:6px auto 0}
@media (max-width:480px){ .card{padding:18px 14px;border-radius:18px} .coach{padding:16px 14px} }
@media (prefers-reduced-motion:reduce){#toast,.track i{transition:none}.track.ind i{animation:none;width:100%;opacity:.5}}
</style>
</head>
<body>
<main class="page">
  <header class="top">
    <div class="toprow">
      <div class="brand"><span class="mono" aria-hidden="true">S</span><span data-i18n="brandSub"></span></div>
      <div class="seg langseg" data-key="lang" role="group" data-aria="langAria">
        <button type="button" data-v="en" aria-pressed="true">EN</button>
        <button type="button" data-v="ru" aria-pressed="false">RU</button>
      </div>
    </div>
    <h1>Stride <em>Lab</em></h1>
    <p class="lede" data-i18n="lede"></p>
    <ul class="specs"><li data-i18n="spec1"></li><li data-i18n="spec2"></li><li data-i18n="spec3"></li></ul>
    <div class="lanes" aria-hidden="true"></div>
  </header>

  <section class="card" id="s-video" aria-labelledby="h-video">
    <div class="eyebrow" data-i18n="eb1"></div>
    <h2 id="h-video" data-i18n="hVideo"></h2>
    <div class="row">
      <input id="file" class="vh" type="file" accept="video/*">
      <label class="btn primary lg" for="file" data-i18n="choose"></label>
      <span id="fname" class="muted"></span>
    </div>

    <details class="gem" id="gem-box">
      <summary><span class="g" data-i18n="gTitle"></span><span class="pill off" id="gem-pill"></span></summary>
      <div class="gembody">
        <p class="muted" data-i18n="gIntro"></p>
        <div class="field">
          <label for="gem-key" data-i18n="gKey"></label>
          <div class="row">
            <input id="gem-key" type="password" autocomplete="off" spellcheck="false" data-ph="gKeyPh">
            <button class="btn primary" type="button" id="gem-save" data-i18n="gSave"></button>
          </div>
        </div>
        <div class="field">
          <label for="gem-model" data-i18n="gModel"></label>
          <select id="gem-model">
            <option value="gemini-flash-latest" data-i18n="gmFlash"></option>
            <option value="gemini-flash-lite-latest" data-i18n="gmLite"></option>
          </select>
        </div>
        <p class="muted" data-i18n="gCost"></p>
        <div class="row">
          <button class="btn" type="button" id="gem-test" data-i18n="gTest"></button>
          <button class="link" type="button" id="gem-forget" data-i18n="gForget"></button>
          <span class="muted" id="gem-msg" role="status"></span>
        </div>
        <p class="muted"><a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener" data-i18n="gGet"></a> · <span data-i18n="gPriv"></span></p>
      </div>
    </details>

    <div class="setup">
      <div class="field">
        <span id="l-leg" data-i18n="lLeg"></span>
        <div class="seg" data-key="side" role="group" aria-labelledby="l-leg">
          <button type="button" data-v="auto" aria-pressed="true" data-i18n="legAuto"></button>
          <button type="button" data-v="left" aria-pressed="false" data-i18n="legL"></button>
          <button type="button" data-v="right" aria-pressed="false" data-i18n="legR"></button>

const deg=r=>r*180/Math.PI;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function median(a){ if(!a.length) return 0; const s=a.slice().sort((x,y)=>x-y); return s[Math.floor(s.length/2)]; }
function pct(a,q){ const s=a.slice().sort((x,y)=>x-y); return s[Math.min(s.length-1,Math.floor(q*(s.length-1)))]; }
const mean=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
function interior(a,v,b){
  const ux=a.x-v.x,uy=a.y-v.y,wx=b.x-v.x,wy=b.y-v.y;
  const d=(ux*wx+uy*wy)/((Math.hypot(ux,uy)*Math.hypot(wx,wy))||1);
  return deg(Math.acos(Math.max(-1,Math.min(1,d))));
}
function metrics(p,dir){
  const S=p[0],H=p[1],K=p[2],A=p[3],T=p[4];
  const seg=(a,b)=>deg(Math.atan2((b.x-a.x)*dir,(b.y-a.y)));
  const thighLen=Math.hypot(H.x-K.x,H.y-K.y)||1;
  return {
    lean:deg(Math.atan2((S.x-H.x)*dir,(H.y-S.y))),
    thigh:seg(H,K), shin:seg(K,A),
    knee:interior(H,K,A), ankle:interior(K,A,T),
    footAhead:((A.x-H.x)*dir)/thighLen
  };
}

async function gemini(parts,schema,signal){
  if(!GEM.key) throw new Error(t('gNoKey'));
  const url='https://generativelanguage.googleapis.com/v1beta/models/'+encodeURIComponent(GEM.model)+':generateContent';
  const gc={responseMimeType:'application/json',responseSchema:schema,
    thinkingConfig:{thinkingLevel:GEM.model.indexOf('lite')>=0?'minimal':'low'}};
  let tries=0, noThink=false;
  for(;;){
    const cfg=Object.assign({},gc); if(noThink) delete cfg.thinkingConfig;
    const res=await fetch(url,{method:'POST',signal:signal,
      headers:{'Content-Type':'application/json','x-goog-api-key':GEM.key},
      body:JSON.stringify({contents:[{role:'user',parts:parts}],generationConfig:cfg})});
    const data=await res.json().catch(()=>({}));
    if(!res.ok){
      const msg=(data.error&&data.error.message)||('HTTP '+res.status);
      if(res.status===400&&!noThink&&/think/i.test(msg)){ noThink=true; continue; }
      if((res.status===429||res.status>=500)&&tries<2){ tries++; await sleep(1500*tries); continue; }
      throw new Error(msg.length>140?msg.slice(0,140)+'…':msg);
    }
    const cand=(data.candidates||[])[0];
    const txt=((cand&&cand.content&&cand.content.parts)||[]).filter(p=>!p.thought).map(p=>p.text||'').join('');
    if(!txt) throw new Error((cand&&cand.finishReason)||'empty reply');
    try{ return JSON.parse(txt); }
    catch(e){ const m=txt.match(/\{[\s\S]*\}/); if(m) return JSON.parse(m[0]); throw new Error('bad JSON'); }
  }
}

const BOX_SCHEMA={type:'OBJECT',properties:{found:{type:'BOOLEAN'},ymin:{type:'NUMBER'},xmin:{type:'NUMBER'},ymax:{type:'NUMBER'},xmax:{type:'NUMBER'}},
  required:['found','ymin','xmin','ymax','xmax']};

function grab(box,maxDim){
  const s=Math.min(1,maxDim/Math.max(box.w,box.h));
  const c=document.createElement('canvas'); c.width=Math.max(1,Math.round(box.w*s)); c.height=Math.max(1,Math.round(box.h*s));
  c.getContext('2d').drawImage(video,box.x,box.y,box.w,box.h,0,0,c.width,c.height);
  return c.toDataURL('image/jpeg',0.9).split(',')[1];
}
function fullBox(){ return {x:0,y:0,w:state.vw,h:state.vh}; }
/* Square crop (in video pixels) around a box, padded, clamped to the frame. */
function padBox(x0,y0,x1,y1,pad){
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const s=Math.min(Math.max(state.vw,state.vh),Math.max(x1-x0,y1-y0,state.vh*0.12)*pad);
  const w=Math.min(state.vw,s), h=Math.min(state.vh,s);
  return {x:Math.max(0,Math.min(state.vw-w,cx-w/2)),y:Math.max(0,Math.min(state.vh-h,cy-h/2)),w:w,h:h};
}
function lmBox(lm){
  const v=lm.filter(p=>p.v===undefined||p.v>0.3); if(!v.length) return fullBox();
  const xs=v.map(p=>p.x*state.vw), ys=v.map(p=>p.y*state.vh);
  return padBox(Math.min(...xs),Math.min(...ys),Math.max(...xs),Math.max(...ys),1.3);
}
/* Step 1 without the pose model: Gemini finds the sprinter, ignoring coaches and spectators. */
async function gemAthleteBox(signal){
  const r=await gemini([{text:'Find the sprinter in this frame: the athlete who is sprinting, starting or in the starting blocks. Ignore coaches, spectators and anyone standing or walking. Return the tight box around the whole sprinter as numbers 0-1000 (ymin, xmin, ymax, xmax) normalized to the image.'},
    {inlineData:{mimeType:'image/jpeg',data:grab(fullBox(),1024)}}],BOX_SCHEMA,signal);
  if(!r||!r.found) return null;
  return padBox(r.xmin/1000*state.vw,r.ymin/1000*state.vh,r.xmax/1000*state.vw,r.ymax/1000*state.vh,1.25);
}
/* Step 2: Gemini places the shoulder and both legs on a sharp crop of the sprinter. Points come back normalized to the whole frame. */
async function gemPose(o){
  const box=o.box;
  const prompt='Side-view sprint frame (cropped around the sprinter). Mark anatomical joint CENTRES for the sprinter only (not clothing edges, not shoe edges):\n'+
    '- shoulder: centre of the shoulder joint nearest the camera (top of the upper arm).\n'+
    'For BOTH legs:\n'+
    '- hip: hip joint centre (greater trochanter, on the side of the pelvis below the waistband; not the waistband, not the front of the belly).\n'+
    '- knee: centre of the knee joint (middle of the knee, between the kneecap and the back of the knee).\n'+
    '- ankle: centre of the ankle bone (malleolus), just above the shoe collar.\n'+
    '- heel: back of the heel, on the sole.\n'+
    '- toe: ball of the foot (metatarsal heads) INSIDE the shoe: on the sole, about two thirds of the way from the heel to the shoe tip, in the direction the shoe points. Not the shoe tip, not below the shoe.\n'+
    'front = the leg whose foot is further forward in the running direction; rear = the other leg. facing = the running direction in the image.\n'+
    (o.label?'This frame was picked as a '+o.label+' frame. Confirm or correct the label.\n':'Also classify the frame.\n')+
    'label: Touchdown = first frame the front foot touches the ground. Toe-off = last frame the rear foot touches the ground. Knee drive = swing thigh at or near its highest point with the foot off the ground. Other = anything else.\n'+
    'Coordinates 0-1000 normalized to this image: x from the left, y from the top. Be precise to the joint centre. If there is no sprinter, set found=false.';
  const r=await gemini([{text:prompt},{inlineData:{mimeType:'image/jpeg',data:o.b64||grab(box,1024)}}],POSE_SCHEMA,o.signal);
  if(!r||!r.found) return null;
  const m=p=>({x:clamp01((box.x+((p&&p.x)||0)/1000*box.w)/state.vw),y:clamp01((box.y+((p&&p.y)||0)/1000*box.h)/state.vh)});
  const leg=L=>{ const o2={}; LEG_KEYS.forEach(k=>{ o2[k]=m(L&&L[k]); }); return o2; };
  return {facing:r.facing,label:r.label,sh:m(r.shoulder),front:leg(r.front),rear:leg(r.rear)};
}
async function gemPoseAnywhere(o){
  const box=await gemAthleteBox(o.signal);
  if(!box) return null;
  return gemPose(Object.assign({},o,{box:box,b64:null}));
}
/* Pose-model hip, moved off the waistband: on real race frames it sat ~0.1 thigh length above the hip joint centre. */
function mpHip(lm){
  const H={x:(lm[23].x+lm[24].x)/2,y:(lm[23].y+lm[24].y)/2}, S={x:(lm[11].x+lm[12].x)/2,y:(lm[11].y+lm[12].y)/2};
  const px=q=>({x:q.x*state.vw,y:q.y*state.vh});
  const h=px(H), s=px(S), th=(Math.hypot(px(lm[25]).x-px(lm[23]).x,px(lm[25]).y-px(lm[23]).y)+Math.hypot(px(lm[26]).x-px(lm[24]).x,px(lm[26]).y-px(lm[24]).y))/2;
  const L=Math.hypot(s.x-h.x,s.y-h.y)||1, ux=(s.x-h.x)/L, uy=(s.y-h.y)/L;
  return {x:clamp01((h.x-0.1*th*ux)/state.vw),y:clamp01((h.y-0.1*th*uy)/state.vh)};
}
/* Ball of the foot from the pose model's heel and toe tip. */
function mpBall(lm,s){ const he=lm[MPI.heel[s]], tp=lm[MPI.toe[s]]; return {x:clamp01(he.x+0.72*(tp.x-he.x)),y:clamp01(he.y+0.72*(tp.y-he.y))}; }
/* Shoulder, hip, knee, ankle, ball of foot for one side (0 = left, 1 = right) plus the other leg, from the pose model. */
function mpChain(lm,s){
  const P=i=>({x:clamp01(lm[i].x),y:clamp01(lm[i].y)}), o=1-s, hip=mpHip(lm);
  return {pts:[P(s?12:11),hip,P(MPI.knee[s]),P(MPI.ankle[s]),mpBall(lm,s)],other:[{x:hip.x,y:hip.y},P(MPI.knee[o]),P(MPI.ankle[o]),mpBall(lm,o)]};
}
/* Combine Gemini with the pose model: where both agree the point is averaged, where they disagree Gemini wins
   (it held up on backlit and blurred frames where the pose model drifted). */
const MPI={hip:[23,24],knee:[25,26],ankle:[27,28],heel:[29,30],toe:[31,32]};
function fusePose(g,lm){
  if(!lm){
    const hip={x:(g.front.hip.x+g.rear.hip.x)/2,y:(g.front.hip.y+g.rear.hip.y)/2};
    const o=Object.assign({fused:false},g,{front:Object.assign({},g.front,{hip:hip}),rear:Object.assign({},g.rear,{hip:{x:hip.x,y:hip.y}})});
    return o;
  }
  const P=i=>({x:lm[i].x,y:lm[i].y,v:lm[i].v==null?1:lm[i].v});
  const dpx=(a,b)=>Math.hypot((a.x-b.x)*state.vw,(a.y-b.y)*state.vh);
  const legD=(s,leg)=>dpx(P(MPI.knee[s]),g[leg].knee)+dpx(P(MPI.ankle[s]),g[leg].ankle);
  const sF=(legD(0,'front')+legD(1,'rear'))<=(legD(1,'front')+legD(0,'rear'))?0:1;
  const th=Math.max(dpx(g.front.hip,g.front.knee),dpx(g.rear.hip,g.rear.knee),1);
  const mix=(a,b)=>(a.v>=0.5&&dpx(a,b)<0.25*th)?{x:(a.x+b.x)/2,y:(a.y+b.y)/2}:{x:b.x,y:b.y};
  const out={facing:g.facing,label:g.label,front:{},rear:{},mpSide:{front:sF,rear:1-sF},fused:true};
  ['front','rear'].forEach(leg=>{ const s=out.mpSide[leg];
    ['knee','ankle'].forEach(j=>{ out[leg][j]=mix(P(MPI[j][s]),g[leg][j]); });
    // The pose model's toe is the toe tip, Gemini's is the ball of the foot: keep Gemini's definition.
    ['heel','toe'].forEach(j=>{ out[leg][j]={x:g[leg][j].x,y:g[leg][j].y}; }); });
  // Hip: in a side view both hip joints overlap, so both thighs share one point. Gemini's two hips and the
  // pose model's hip (which sits on the waistband, so it is moved down 0.1 thigh) are averaged.
  const gh={x:(g.front.hip.x+g.rear.hip.x)/2,y:(g.front.hip.y+g.rear.hip.y)/2};
  const mh=mpHip(lm), hs=[g.front.hip,g.rear.hip];
  if(mh&&dpx(mh,gh)<0.4*th) hs.push(mh);
  const hip={x:mean(hs.map(q=>q.x)),y:mean(hs.map(q=>q.y))};
  out.front.hip=hip; out.rear.hip={x:hip.x,y:hip.y};
  const s0=P(11), s1=P(12);
  out.sh=mix(dpx(s0,g.sh)<=dpx(s1,g.sh)?s0:s1,g.sh);
  return out;
}
/* True when Gemini's legs sit far from the pose model's person: the crop was probably around someone else. */
function poseDisagrees(g,lm){
  if(!g||!lm) return false;
  const dpx=(a,b)=>Math.hypot((a.x-b.x)*state.vw,(a.y-b.y)*state.vh);
  const th=Math.max(dpx(g.front.hip,g.front.knee),dpx(g.rear.hip,g.rear.knee),1);
  const ds=[];
  ['front','rear'].forEach(leg=>['hip','knee','ankle'].forEach(j=>{ ds.push(Math.min(dpx(g[leg][j],lm[MPI[j][0]]),dpx(g[leg][j],lm[MPI[j][1]]))); }));
  return median(ds)>0.6*th;
}
/* Pick the leg the checks need: stance leg for touchdown and toe-off, swing leg for knee drive. */
function chainFor(P,mode,label,dir){
  const low=L=>Math.max(L.heel.y,L.toe.y);
  const thighF=L=>Math.atan2((L.knee.x-L.hip.x)*state.vw*dir,(L.knee.y-L.hip.y)*state.vh);
  let pick=null;
  if((mode==='left'||mode==='right')&&P.mpSide){ const want=mode==='left'?0:1; pick=P.mpSide.front===want?'front':'rear'; }
  if(!pick){
    const m=(mode==='stance'||mode==='swing')?mode:(label==='Knee drive'?'swing':'stance');
    pick=m==='swing'?(thighF(P.front)>=thighF(P.rear)?'front':'rear'):(low(P.front)>=low(P.rear)?'front':'rear');
  }
  const A=P[pick], B=P[pick==='front'?'rear':'front'];
  return {pts:[P.sh,A.hip,A.knee,A.ankle,A.toe],other:[B.hip,B.knee,B.ankle,B.toe],
    side:P.mpSide?(P.mpSide[pick]===0?'L':'R'):null};
}

/* ---------- AI pose model (MediaPipe, runs in the browser) ---------- */
const LIB='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14';
// Heavy model: on the race test frames it halved the joint error of the lite model and never lost the athlete.
const MODEL_URLS=['https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_heavy/float16/1/pose_landmarker_heavy.task',
  'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_full/float16/1/pose_landmarker_full.task'];
let landmarker=null;
function withTimeout(p,ms){
  return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')),ms))]);
}
async function loadModel(){
  try{
    const mod=await withTimeout(import(LIB+'/vision_bundle.mjs'),30000);
    const fileset=await withTimeout(mod.FilesetResolver.forVisionTasks(LIB+'/wasm'),30000);
    const make=(url,delegate)=>mod.PoseLandmarker.createFromOptions(fileset,{
      baseOptions:{modelAssetPath:url,delegate:delegate},
      runningMode:'IMAGE',numPoses:3,
      minPoseDetectionConfidence:0.3,minPosePresenceConfidence:0.3,minTrackingConfidence:0.3
    });
    for(const url of MODEL_URLS){
      try{ landmarker=await withTimeout(make(url,'GPU'),60000); break; }
      catch(e){ try{ landmarker=await withTimeout(make(url,'CPU'),60000); break; }catch(e2){} }
    }
    if(!landmarker) throw new Error('no model');
    state.model='ready';
  }catch(e){
    state.model='failed';
  }
  updateUI();
  if(state.ready&&!state.job){ detectNow(true); draw(); updateUI(); }
  if(state.pendingAuto){ state.pendingAuto=false; autoAnalyze(); }
}

const SIDE_IDX={L:[11,23,25,27,31],R:[12,24,26,28,32]};
const OTHER_IDX={L:[24,26,28,32],R:[23,25,27,31]};
const clamp01=v=>Math.max(0,Math.min(1,v));
const toLm=lm=>lm.map(p=>({x:p.x,y:p.y,v:p.visibility==null?1:p.visibility}));
function lmBB(lm){
  const v=lm.filter(p=>p.v>0.3); const a=v.length?v:lm;
  const xs=a.map(p=>p.x), ys=a.map(p=>p.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  return {cx:(x0+x1)/2,cy:(y0+y1)/2,w:x1-x0,h:y1-y0};
}
/* Several people can be in frame (coach, other runners, spectators). Follow the athlete. */
function pickCandidate(cands){
  if(!cands||!cands.length) return null;
  if(state.track&&state.track.length){
    const tm=video.currentTime; let ref=state.track[0], bd=1e9;
    state.track.forEach(q=>{ const d=Math.abs(q.t-tm); if(d<bd){bd=d;ref=q;} });
    if(bd<0.5){
      let best=null,bs=1e9;
      cands.forEach(c=>{ const b=lmBB(c); const d=Math.hypot(b.cx-ref.cx,b.cy-ref.cy)/Math.max(ref.h,0.05); if(d<bs){bs=d;best=c;} });
      if(best&&bs<1.2) return best;
    }
  }
  return cands.slice().sort((a,b)=>{ const A=lmBB(a),B=lmBB(b); return B.w*B.h-A.w*A.h; })[0];
}
/* Link detections frame to frame and keep the person who moves the most: the sprinter, not the standing coach. */
function assignTrack(frames){
  const tracks=[];
  frames.forEach((f,k)=>{
    (f.cands||[]).forEach(c=>{
      const b=lmBB(c); let best=null,bd=1e9;
      tracks.forEach(tr=>{
        const l=tr.items[tr.items.length-1]; if(l.k===k||k-l.k>12) return;
        const d=Math.hypot(b.cx-l.b.cx,b.cy-l.b.cy)/Math.max(l.b.h,0.05), r=b.h/Math.max(l.b.h,1e-3);
        if(d<0.6&&r>0.6&&r<1.6&&d<bd){bd=d;best=tr;}
      });
      if(best) best.items.push({k:k,b:b,c:c}); else tracks.push({items:[{k:k,b:b,c:c}]});
    });
  });
  // Sprinter = fastest leg action relative to the hip (camera panning does not matter); a walker scores ~3x lower,
  // a standing coach ~0. Size and time in view count too, but less.
  let win=null,ws=-1;
  const slow=state.slow||1;
  tracks.forEach(tr=>{
    const it=tr.items; if(it.length<3) return;
    const mh=mean(it.map(i=>i.b.h)); let mv=0, tt=0;
    for(let i=1;i<it.length;i++){
      const a=it[i-1].c, b=it[i].c, dtt=(frames[it[i].k].t-frames[it[i-1].k].t)/slow; if(dtt<=0||dtt>0.25) continue;
      const rel=(c,j)=>(c[j].x-(c[23].x+c[24].x)/2)*state.vw, relY=(c,j)=>(c[j].y-(c[23].y+c[24].y)/2)*state.vh;
      let d=0; [27,28].forEach(j=>{ d+=Math.hypot(rel(b,j)-rel(a,j),relY(b,j)-relY(a,j)); });
      mv+=d/Math.max(mh*state.vh,1); tt+=dtt;
    }
    const speed=tt>0?mv/tt:0;
    const score=Math.sqrt(it.length)*mh*(1+4*speed);
    if(score>ws){ws=score;win=tr;}
  });
  frames.forEach(f=>{ f.lm=null; });
  state.track=[];
  if(win) win.items.forEach(i=>{ frames[i.k].lm=i.c; state.track.push({t:frames[i.k].t,cx:i.b.cx,cy:i.b.cy,h:i.b.h}); });
}
function applyLandmarks(lm){
  state.lastLm=lm||null;
  if(!lm){ state.pts=[]; state.pts2=[]; return false; }
  const vis=i=>lm[i]&&lm[i].v!==undefined?lm[i].v:1;
  const score=s=>SIDE_IDX[s].reduce((a,i)=>a+vis(i),0)/5;
  let side=state.side==='left'?'L':state.side==='right'?'R':null;
  if(!side){
    const l=score('L'), r=score('R');
    side=state.lastSide;
    if(side==='L'&&r>l+0.15) side='R';
    else if(side==='R'&&l>r+0.15) side='L';
    state.lastSide=side;
  }
  const d=(lm[0].x-(lm[11].x+lm[12].x)/2)+((lm[31].x-lm[29].x)+(lm[32].x-lm[30].x))/2;
  if(Math.abs(d)>0.01){
    state.dirAcc=state.dirAcc*0.85+(d>0?1:-1)*0.15;
    if(state.dirMode==='auto') state.autoDir=state.dirAcc>=0?1:-1;
  }
  if(score(side)<0.3){ state.pts=[]; state.pts2=[]; return false; }
  const ch=mpChain(lm,side==='L'?0:1);
  state.pts=ch.pts; state.pts2=ch.other;
  state.ptsSrc='pose';
  return true;
}
let busy=false;
function detectNow(force){
  if(!state.ready||state.model!=='ready'||busy||state.active>=0||state.scanning) return;
  if(!force&&video.currentTime===state.lastDetT) return;
  busy=true;
  state.lastDetT=video.currentTime;
  try{
    const res=landmarker.detect(video);
    state.found=applyLandmarks(pickCandidate(((res&&res.landmarks)||[]).map(toLm)));
  }catch(e){ state.found=false; state.pts=[]; state.pts2=[]; }
  busy=false;
}

/* ---------- drawing ---------- */
/* The other leg, drawn thinner in silver-blue so a swapped or drifting leg is easy to spot. */
function drawLeg2(c,p,lw,r){
  if(!p||p.length<2) return;
  c.save(); c.lineCap='round'; c.lineJoin='round';
  c.beginPath(); c.moveTo(p[0].x,p[0].y); for(let i=1;i<p.length;i++) c.lineTo(p[i].x,p[i].y);
  c.strokeStyle='rgba(0,0,0,.55)'; c.lineWidth=lw*1.6; c.stroke();
  c.strokeStyle='#A9C8F5'; c.lineWidth=lw*0.7; c.stroke();
  p.forEach(q=>{ c.beginPath(); c.arc(q.x,q.y,r*0.7,0,Math.PI*2); c.fillStyle='#DCE8FA'; c.fill(); c.lineWidth=lw*.5; c.strokeStyle='rgba(0,0,0,.7)'; c.stroke(); });
  c.restore();
}
function drawSkeleton(c,p,lw,r,activeIdx){
  c.save(); c.lineCap='round'; c.lineJoin='round';
  if(p.length>1){
    c.beginPath(); c.moveTo(p[0].x,p[0].y); for(let i=1;i<p.length;i++) c.lineTo(p[i].x,p[i].y);
    c.strokeStyle='rgba(0,0,0,.6)'; c.lineWidth=lw*2.2; c.stroke();
    c.strokeStyle=SKEL; c.lineWidth=lw; c.stroke();
  }
  p.forEach((q,i)=>{
    const rr=i===activeIdx?r*1.35:r;
    c.beginPath(); c.arc(q.x,q.y,rr,0,Math.PI*2);
    c.fillStyle='#FFF8EA'; c.fill(); c.lineWidth=lw*.7; c.strokeStyle='rgba(0,0,0,.75)'; c.stroke();
  });
  c.restore();
}
function draw(){
  if(!state.ready) return;
  const w=canvas.width,h=canvas.height;
  try{ctx.drawImage(video,0,0,w,h);}catch(e){}
  if(state.pts2&&state.pts2.length) drawLeg2(ctx,state.pts2.map(q=>({x:q.x*w,y:q.y*h})),w/230,w/110);
  drawSkeleton(ctx,state.pts.map(q=>({x:q.x*w,y:q.y*h})),w/230,w/110,state.active);
  if(state.active>=0) drawLoupe();
}
function drawLoupe(){
  const p=state.pts[state.active]; if(!p) return;
  const w=canvas.width, L=Math.round(w*0.26), z=3, m=Math.round(w*0.02);
  const left=p.x>0.5?m:w-L-m, top=m;
  const src=(L/z)*(state.vw/w);
  const sx=p.x*state.vw-src/2, sy=p.y*state.vh-src/2;
  ctx.save();
  ctx.beginPath(); ctx.arc(left+L/2,top+L/2,L/2,0,Math.PI*2); ctx.clip();
  ctx.fillStyle='#000'; ctx.fillRect(left,top,L,L);
  try{ctx.drawImage(video,sx,sy,src,src,left,top,L,L);}catch(e){}
  ctx.restore();
  ctx.save();
  ctx.strokeStyle=SKEL; ctx.lineWidth=w/300; ctx.beginPath(); ctx.arc(left+L/2,top+L/2,L/2,0,Math.PI*2); ctx.stroke();
  ctx.strokeStyle='#fff'; ctx.lineWidth=w/500;
  ctx.beginPath(); ctx.moveTo(left+L/2-L*.12,top+L/2); ctx.lineTo(left+L/2+L*.12,top+L/2);
  ctx.moveTo(left+L/2,top+L/2-L*.12); ctx.lineTo(left+L/2,top+L/2+L*.12); ctx.stroke();
  ctx.restore();
}
function thumb(p,vw,vh,bg,p2){
  const xs=p.map(q=>q.x), ys=p.map(q=>q.y);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  let H=Math.max(y1-y0,(x1-x0)*4/3)*1.7, W=H*3/4;
  if(W>vw){W=vw;H=W*4/3;}
  if(H>vh){H=vh;W=H*3/4;}
  const cx=(x0+x1)/2, cy=(y0+y1)/2;
  const x=Math.max(0,Math.min(vw-W,cx-W/2)), y=Math.max(0,Math.min(vh-H,cy-H/2));
  const c=document.createElement('canvas'); c.width=TW; c.height=TH;
  const g=c.getContext('2d');
  try{bg(g,{x:x,y:y,w:W,h:H});}catch(e){g.fillStyle='#0B0A08';g.fillRect(0,0,TW,TH);}

function snapFps(f){
  const STD=[24,25,30,48,50,60,90,100,120,240];
  let best=30,bd=1e9; STD.forEach(s=>{const d=Math.abs(Math.log(f/s)); if(d<bd){bd=d;best=s;}});

/* Reads the real frame rate by playing a moment of the clip slowly and timing the decoded frames. */
function detectFps(){
  return new Promise(resolve=>{
    if(!('requestVideoFrameCallback' in HTMLVideoElement.prototype)) return resolve(0);
    const times=[]; let stop=false, done=false;
    const cb=(now,md)=>{ times.push(md.mediaTime); if(!stop&&times.length<48) video.requestVideoFrameCallback(cb); };
    const finish=()=>{
      if(done) return; done=true; stop=true; video.pause();
      const d=[]; for(let i=1;i<times.length;i++){ const x=times[i]-times[i-1]; if(x>0.0005) d.push(x); }
      if(d.length<4) return resolve(0);
      d.sort((a,b)=>a-b);
      resolve(snapFps(1/d[Math.floor(d.length*0.25)]));
    };
    video.requestVideoFrameCallback(cb);
    video.playbackRate=0.25;
    const p=video.play();
    if(p&&p.catch) p.catch(()=>{ stop=true; done=true; resolve(0); });
    setTimeout(finish,1100);
  });
}
/* Exact frame rate from the MP4 / MOV header: the video track's timescale over its most common frame duration. */
async function mp4Fps(file){
  try{
    if(!file) return 0;
    const str=(dv,o)=>String.fromCharCode(dv.getUint8(o),dv.getUint8(o+1),dv.getUint8(o+2),dv.getUint8(o+3));
    let off=0, moov=null;
    while(off+8<=file.size){
      const h=new DataView(await file.slice(off,off+16).arrayBuffer());
      let size=h.getUint32(0), hdr=8; const type=str(h,4);
      if(size===1){ size=Number(h.getBigUint64(8)); hdr=16; } else if(size===0) size=file.size-off;
      if(size<8) return 0;
      if(type==='moov'){ moov=new DataView(await file.slice(off+hdr,off+size).arrayBuffer()); break; }
      off+=size;
    }
    if(!moov) return 0;
    const kids=(s,e)=>{ const out=[]; let o=s;
      while(o+8<=e){ let size=moov.getUint32(o), hdr=8; const type=str(moov,o+4);
        if(size===1){ size=Number(moov.getBigUint64(o+8)); hdr=16; } else if(size===0) size=e-o;
        if(size<8) break; out.push({type:type,s:o+hdr,e:o+size}); o+=size; }
      return out; };
    for(const trak of kids(0,moov.byteLength).filter(b=>b.type==='trak')){
      const mdia=kids(trak.s,trak.e).find(b=>b.type==='mdia'); if(!mdia) continue;
      const mk=kids(mdia.s,mdia.e);
      const hdlr=mk.find(b=>b.type==='hdlr'); if(!hdlr||str(moov,hdlr.s+8)!=='vide') continue;
      const mdhd=mk.find(b=>b.type==='mdhd'), minf=mk.find(b=>b.type==='minf'); if(!mdhd||!minf) continue;
      const scale=moov.getUint32(mdhd.s+(moov.getUint8(mdhd.s)===1?20:12));
      const stbl=kids(minf.s,minf.e).find(b=>b.type==='stbl'); if(!stbl) continue;
      const stts=kids(stbl.s,stbl.e).find(b=>b.type==='stts'); if(!stts) continue;
      const n=moov.getUint32(stts.s+4); let best=0,bc=0;
      for(let i=0;i<n&&i<100000;i++){ const c=moov.getUint32(stts.s+8+i*8), d=moov.getUint32(stts.s+12+i*8); if(c>bc){bc=c;best=d;} }
      if(best>0&&scale>0) return snapFps(scale/best);
    }
  }catch(e){}
  return 0;
}

const MAXF=900;
async function scanVideo(job){

  }

function fillGaps(a,maxGap){
  let i=0;
  while(i<a.length){
    if(a[i]!=null){i++;continue;}
    let j=i; while(j<a.length&&a[j]==null) j++;
    if(i>0&&j<a.length&&j-i<=maxGap){ for(let k=i;k<j;k++) a[k]=a[i-1]+(a[j]-a[i-1])*(k-i+1)/(j-i+1); }
    i=j;
  }

/* Ground contacts from where the lowest foot point sits against a rolling ground line. */
function findEvents(sc){
  const F=sc.frames, N=F.length, vw=state.vw, vh=state.vh, dt=sc.dt, slow=state.slow;
  if(N<6) return null;
  const P=(f,i)=>({x:f.lm[i].x*vw,y:f.lm[i].y*vh,v:f.lm[i].v});
  const low=[new Array(N).fill(null),new Array(N).fill(null)];
  const legs=[], dirv=[];
  F.forEach((f,k)=>{
    if(!f.lm) return;
    for(const s of [0,1]){
      const he=P(f,LMI.heel[s]), to=P(f,LMI.toe[s]);
      low[s][k]=Math.max(he.y,to.y);
      const H=P(f,LMI.hip[s]),K=P(f,LMI.knee[s]),A=P(f,LMI.ank[s]);
      legs.push(dist(H,K)+dist(K,A));
      dirv.push(to.x-he.x);
    }
    dirv.push((f.lm[0].x-(f.lm[11].x+f.lm[12].x)/2)*vw);
  });
  const leg=median(legs); if(!leg) return null;
  if(state.dirMode==='auto'){ const sd=dirv.reduce((a,b)=>a+Math.sign(b),0); state.autoDir=sd>=0?1:-1; }
  const dir=curDir();
  fillGaps(low[0],3); fillGaps(low[1],3);
  // High-speed video: smooth the foot height over ~10 ms so landmark jitter does not read as tiny steps.
  const sw=Math.floor(Math.max(0,Math.round(0.012*slow/dt))/2);
  if(sw>0) [0,1].forEach(s=>{ const a=low[s], o=a.slice();
    for(let k=0;k<N;k++){ const w=[]; for(let j=k-sw;j<=k+sw;j++) if(j>=0&&j<N&&a[j]!=null) w.push(a[j]); if(a[k]!=null&&w.length) o[k]=median(w); }
    low[s]=o; });
  const win=Math.max(4,Math.round(0.6*slow/dt));
  const ground=new Array(N).fill(null);
  for(let k=0;k<N;k++){
    const vals=[];
    for(let j=Math.max(0,k-win);j<=Math.min(N-1,k+win);j++){ if(low[0][j]!=null) vals.push(low[0][j]); if(low[1][j]!=null) vals.push(low[1][j]); }

    const s=stance[k], nx=k+1<N?low[s][k+1]:null;

  }

  segs=segs.filter(s=>{
    const fa=F[s.a], fb=F[s.b]; if(!fa.lm||!fb.lm) return true;
    const rel=f=>(f.lm[LMI.toe[s.mp]].x-f.lm[LMI.hip[s.mp]].x)*vw;
    const span=s.b>s.a?Math.abs(rel(fb)-rel(fa)):0;

  if(!segs.length) return {picked:[],rhythm:null};
  // Alternate left and right step by step, counting a missed step when a gap is unusually long.
  const gaps=[]; for(let i=1;i<segs.length;i++) gaps.push(segs[i].a-segs[i-1].a);

    const end=nx?nx.a-1:Math.min(N-1,s.b+Math.round(0.25*slow/dt));
    let best=null;
    for(let k=s.a;k<=end;k++){
      const f=F[k]; if(!f.lm) continue;
      for(const sd of [0,1]){
        if(low[sd][k]==null||ground[k]==null||low[sd][k]>=ground[k]-tol) continue;
        const th=thigh(f,sd);
        if(!best||th>best.th) best={k:k,s:sd,th:th};
      }
    }
    if(best&&best.k>s.a&&best.k<end) s.kd=best;
  });
  const chain=(k,s)=>{ const f=F[k], c=mpChain(f.lm,s); const ids=[LMI.sh[s],LMI.hip[s],LMI.knee[s],LMI.ank[s],LMI.toe[s]]; return {pts:c.pts,other:c.other,vis:mean(ids.map(i=>f.lm[i].v))}; };
  const picked=[];
  const sides=state.side==='left'?['L']:state.side==='right'?['R']:['L','R'];
  sides.forEach(X=>{
    let best=null;
    segs.forEach((s,i)=>{
      if(s.side!==X||!s.full||!F[s.a].lm||!F[s.b].lm) return;
      const td=chain(s.a,stance[s.a]);
      const hipx=td.pts[1].x;
      const nx=segs[i+1];
      const score=td.vis+(1-2*Math.abs(hipx-0.5))*0.6+(nx&&nx.kd?0.3:0);
      if(!best||score>best.score) best={score:score,s:s,nx:nx};
    });
    if(!best) return;
    const s=best.s;
    const td=chain(s.a,stance[s.a]), to=chain(s.b,stance[s.b]);

    picked.push({label:'Toe-off',t:F[s.b].t,leg:'stance',side:X,pts:to.pts,other:to.other,lm:F[s.b].lm});
    if(best.nx&&best.nx.kd){ const kd=best.nx.kd, kc=chain(kd.k,kd.s); picked.push({label:'Knee drive',t:F[kd.k].t,leg:'swing',side:X,pts:kc.pts,other:kc.other,lm:F[kd.k].lm}); }
  });

/* Without the pose model: Gemini picks the frames from small stills, then places the joints. */
async function gemFindFrames(job){
  const dur=video.duration||0, slow=state.slow, fps=state.fps, sig=job.ctrl.signal;
  setProg(t('pGemFrames'),null);
  let center=dur/2;
  if(dur>1.5*slow){
    const n=12, times=[]; for(let i=0;i<n;i++) times.push((i+0.5)*dur/n);
    const parts=[{text:'These are '+n+' stills from a side-view sprint video, in time order. Pick the index of the still where the athlete is clearly sprinting, fully in view and closest to side-on. If no athlete is running in any still, set found=false.'}];
    for(let i=0;i<n;i++){ chk(job); await seekTo(times[i]); draw(); parts.push({text:'Still '+i}); parts.push({inlineData:{mimeType:'image/jpeg',data:grab(fullBox(),320)}}); }
    const r=await gemini(parts,{type:'OBJECT',properties:{found:{type:'BOOLEAN'},best:{type:'INTEGER'}},required:['found','best']},sig);
    if(!r.found) return [];
    center=times[Math.max(0,Math.min(n-1,r.best|0))];
  }
  const win=0.7*slow, t0=Math.max(0,Math.min(dur-win,center-win/2)), t1=Math.min(dur,t0+win);
  const count=Math.max(1,Math.round((t1-t0)*fps)), stride=Math.max(1,Math.ceil(count/16));
  const times=[]; for(let i=0;i<count;i+=stride) times.push(t0+(i+0.5)/fps);
  const parts=[{text:'These are '+times.length+' consecutive frames'+(stride>1?' (every '+stride+' video frames)':'')+' from a side-view sprint video. '+
    'List each touchdown, toe-off and knee drive you can see, with the index of the frame that best shows it. '+
    'Touchdown = the first frame the front foot touches the ground. Toe-off = the last frame the rear foot touches the ground. Knee drive = the swing thigh at its highest with the foot off the ground. '+
    'leg = the athlete\'s left or right leg for that event (the stance leg for touchdown and toe-off, the swing leg for knee drive). Only list events you are confident about.'}];
  for(let i=0;i<times.length;i++){ chk(job); await seekTo(times[i]); draw(); parts.push({text:'Frame '+i}); parts.push({inlineData:{mimeType:'image/jpeg',data:grab(fullBox(),448)}}); }
  setProg(t('pGemFrames'),null);
  const r=await gemini(parts,{type:'OBJECT',properties:{events:{type:'ARRAY',items:{type:'OBJECT',properties:{
    label:{type:'STRING',enum:['Touchdown','Toe-off','Knee drive']},index:{type:'INTEGER'},leg:{type:'STRING',enum:['left','right','unclear']}},
    required:['label','index','leg']}}},required:['events']},sig);
  const out=[], seen={};
  (r.events||[]).forEach(e=>{
    const i=Math.max(0,Math.min(times.length-1,e.index|0)), key=e.label+i;
    if(seen[key]) return; seen[key]=1;
    out.push({label:e.label,t:times[i],leg:e.label==='Knee drive'?'swing':'stance',side:e.leg==='left'?'L':e.leg==='right'?'R':null});
  });
  return out.sort((a,b)=>a.t-b.t).slice(0,6);
}
async function autoAnalyze(){
  if(!state.ready||state.job) return;
  const hasPose=state.model==='ready', hasGem=!!GEM.key;
  if(!hasPose&&!hasGem){ setProg(t('pNoModel'),null,'warn'); return; }
  const job={cancel:false,ctrl:new AbortController()};
  state.job=job; state.scanning=true; if(!video.paused) video.pause();
  setNeeds(false); $('#stage').classList.add('busy'); updateUI();
  let gemWarn='', longNote='';
  try{
    let events=[];
    if(hasPose){
      const sc=await scanVideo(job);
      if(sc.stride>1) longNote=t('pLong',sc.stride);
      setProg(t('pEvents'),null);
      const ev=findEvents(sc);
      state.rhythm=ev&&ev.rhythm&&ev.rhythm.steps>=2?ev.rhythm:null;
      events=ev?ev.picked:[];
      if(hasGem&&(!events.length||!state.rhythm)){ state.rhythm=null; events=await gemFindFrames(job); }
    } else {
      state.rhythm=null;
      events=await gemFindFrames(job);
    }
    if(!events.length){ setProg(t('pNoSteps'),null,'warn'); return; }
    // Grab each key frame, then let Gemini place the joints (three requests at a time).
    const shots=[];
    for(const e of events){
      chk(job); await seekTo(e.t);
      const box=e.lm?lmBox(e.lm):null;
      shots.push({e:e,box:box,b64:box?grab(box,1024):null,img:null});
    }
    const results=new Array(shots.length).fill(null);
    if(hasGem){
      let done=0, next=0;
      setProg(t('pGem',1,shots.length),0);
      const worker=async()=>{
        while(next<shots.length){
          const i=next++; const sh=shots[i];
          try{
            results[i]=sh.box?await gemPose({box:sh.box,b64:sh.b64,label:sh.e.label,signal:job.ctrl.signal})
              :await (async()=>{ await seekTo(sh.e.t); return gemPoseAnywhere({label:sh.e.label,signal:job.ctrl.signal}); })();
          }catch(err){ if(job.cancel) throw err; gemWarn=err.message; }
          done++; setProg(t('pGem',Math.min(done+1,shots.length),shots.length),done/shots.length);
        }
      };
      // Frames without a pose-model crop need seeking, so run those one at a time.
      const parallel=shots.every(s=>s.box)?3:1;
      await Promise.all(Array.from({length:parallel},worker));
      for(let i=0;i<shots.length;i++){
        const sh=shots[i];
        if(!sh.box||(results[i]&&!poseDisagrees(results[i],sh.e.lm))) continue;
        chk(job);
        try{
          await seekTo(sh.e.t);
          const g=await gemPoseAnywhere({label:sh.e.label,signal:job.ctrl.signal});
          if(g){ results[i]=g; if(poseDisagrees(g,sh.e.lm)) sh.e.lm=null; }
        }catch(err){ if(job.cancel) throw err; gemWarn=err.message; }
      }
    }
    chk(job);
    const poses=[];
    for(let i=0;i<shots.length;i++){
      const sh=shots[i], g=results[i];
      if(g&&!sh.e.lm&&state.dirMode==='auto'&&(g.facing==='right'||g.facing==='left')) state.autoDir=g.facing==='right'?1:-1;
      let pts=sh.e.pts, other=sh.e.other||[], src='pose', side=sh.e.side||null;
      if(g){
        const P=fusePose(g,sh.e.lm);
        const mode=state.side==='left'?'left':state.side==='right'?'right':sh.e.leg;
        const ch=chainFor(P,mode,sh.e.label,curDir());
        pts=ch.pts; other=ch.other; src=P.fused?'fused':'gemini'; side=side||ch.side;
      }
      if(!pts) continue;
      await seekTo(sh.e.t);
      const px=q=>({x:q.x*state.vw,y:q.y*state.vh});
      const p=pts.map(px), p2=other.map(px);
      poses.push({id:state.nextId++,label:sh.e.label,t:sh.e.t,p:p,p2:p2,img:videoThumb(p,p2),demo:false,side:side,src:src,contactMs:sh.e.contactMs||null});
      state.pts=pts; state.pts2=other; state.ptsSrc=src==='pose'?'pose':'gemini'; draw();
    }
    const dirNow=curDir();
    poses.forEach(ps=>{ ps.m=metrics(ps.p,dirNow); });
    state.poses=state.poses.filter(p=>!p.demo&&p.src==='manual').concat(poses).sort((a,b)=>a.t-b.t);
    state.coach=null; state.coachErr='';
    renderKino(); renderReport();
    const parts=[t('pDone',poses.length)];
    if(gemWarn) parts.push(t('pGemFail',gemWarn));
    if(longNote) parts.push(longNote);
    const doneMsg=parts.join(' '), doneTone=gemWarn?'warn':'good';
    setProg(doneMsg,1,doneTone);
    if(poses.length&&state.ready) await seekTo(poses[0].t);
    if(hasGem&&poses.length){ state.job=null; await askCoach(job,doneMsg,doneTone); }
  }catch(e){
    if(job.cancel||e.cancelled||e.name==='AbortError') setProg(t('pCancelled'),null,'warn');
    else setProg(t('gBad',e.message),null,'bad');
  }finally{
    if(state.job===job) state.job=null;
    state.scanning=false; $('#stage').classList.remove('busy');
    if(state.ready) setNeeds(true);
    $('#prog-x').hidden=true;
    state.found=state.pts.length===JOINTS;
    draw(); updateUI();
  }
}
$('#auto').addEventListener('click',()=>autoAnalyze());

/* One frame: Gemini places the joints where the playhead is. */
$('#gemFrame').addEventListener('click',async()=>{
  if(!state.ready||state.job) return;
  if(!GEM.key){ toast(t('gNoKey')); $('#gem-box').open=true; $('#gem-box').scrollIntoView({behavior:'smooth',block:'center'}); return; }
  if(!video.paused) video.pause();
  const job={cancel:false,ctrl:new AbortController()}; state.job=job; updateUI();
  setProg(t('pGem',1,1),null);
  try{
    const mode=state.side==='left'?'left':state.side==='right'?'right':'auto';
    const lm=state.lastLm;
    const r=lm?await gemPose({box:lmBox(lm),signal:job.ctrl.signal})
      :await gemPoseAnywhere({signal:job.ctrl.signal});
    if(!r){ setProg(t('gemNone'),null,'warn'); return; }
    if(state.dirMode==='auto'&&(r.facing==='right'||r.facing==='left')&&!lm) state.autoDir=r.facing==='right'?1:-1;
    const P=fusePose(r,lm), ch=chainFor(P,mode,r.label,curDir());
    state.pts=ch.pts; state.pts2=ch.other; state.ptsSrc='gemini'; state.found=true;
    if(CYCLE.indexOf(r.label)>=0||r.label==='Other'){ state.label=r.label; setSeg('label',r.label); }
    setProg(t('gemPlaced',t('lab.'+r.label)),1,'good');
  }catch(e){
    if(job.cancel||e.name==='AbortError') setProg(t('pCancelled'),null,'warn'); else setProg(t('gBad',e.message),null,'bad');
  }finally{ state.job=null; $('#prog-x').hidden=true; draw(); updateUI(); }
});

/* ---------- joints: automatic, with manual correction ---------- */
function toFrac(e){
  const r=canvas.getBoundingClientRect();
  return {x:Math.max(0,Math.min(1,(e.clientX-r.left)/r.width)), y:Math.max(0,Math.min(1,(e.clientY-r.top)/r.height))};
}
canvas.addEventListener('pointerdown',e=>{
  if(!state.ready||state.job) return;
  e.preventDefault();
  if(!video.paused) video.pause();
  const f=toFrac(e), r=canvas.getBoundingClientRect();
  let idx=-1,best=34;
  state.pts.forEach((p,i)=>{
    const d=Math.hypot((p.x-f.x)*r.width,(p.y-f.y)*r.height);
    if(d<best){best=d;idx=i;}
  });
  let off={x:0,y:0};
  if(idx<0){
    if(state.pts.length>=JOINTS) return;
    state.pts.push(f); idx=state.pts.length-1;
  } else off={x:state.pts[idx].x-f.x,y:state.pts[idx].y-f.y};
  state.active=idx; state.drag=off;
  try{canvas.setPointerCapture(e.pointerId);}catch(err){}
  draw();
});
canvas.addEventListener('pointermove',e=>{
  if(state.active<0) return;
  e.preventDefault();
  const f=toFrac(e);
  state.pts[state.active]={
    x:Math.max(0,Math.min(1,f.x+state.drag.x)),
    y:Math.max(0,Math.min(1,f.y+state.drag.y))
  };
  draw();
});
function endDrag(){
  if(state.active<0) return;
  state.active=-1; state.drag=null; draw(); updateUI();
}
canvas.addEventListener('pointerup',endDrag);
canvas.addEventListener('pointercancel',endDrag);

function setSeg(key,val){
  const seg=document.querySelector('.seg[data-key="'+key+'"]');
  seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===String(val)?'true':'false'));
}
document.querySelectorAll('.seg').forEach(seg=>seg.addEventListener('click',e=>{
  const b=e.target.closest('button'); if(!b||!seg.contains(b)) return;
  const key=seg.dataset.key, raw=b.dataset.v;
  if(key==='lang'){ setLang(raw); return; }
  setSeg(key,raw);
  if(key==='dir'){ state.dirMode=raw; recomputeMetrics(); }
  if(key==='side'){ state.side=raw; detectNow(true); draw(); }
  if(key==='phase'){ state.phaseMode=raw; renderReport(); }
  if(key==='slow'){
    const k=state.slow/Number(raw); state.slow=Number(raw);
    state.poses.forEach(p=>{ if(p.contactMs) p.contactMs*=k; });
    const r=state.rhythm;
    if(r){ ['contactL','contactR','contact','flight','res'].forEach(f=>{ r[f]*=k; }); r.rate/=k; }
    state.coach=null; renderReport();
  }
  if(key==='speed'){state.speed=Number(raw); video.playbackRate=state.speed;}
  if(key==='label') state.label=raw;
  updateUI();
}));
function recomputeMetrics(){
  const d=curDir();
  state.poses.forEach(p=>{ if(p.p&&!p.demo) p.m=metrics(p.p,d); });
  renderKino(); renderReport();
}

function updateUI(){
  const n=state.pts.length;
  let chips='';
  for(let i=0;i<JOINTS;i++) chips+='<li class="'+(i<n?'done':i===n?'next':'')+'"><span>'+(i+1)+'</span>'+t('j'+i)+'</li>';
  $('#chips').innerHTML=chips;
  $('#hint').textContent=!state.ready?t('hintNone'):n<JOINTS?t('hintPlace',t('j'+n).toLowerCase(),t('jh'+n)):t('hintDone');
  let s='loading', key='mLoad';
  if(state.ready&&state.ptsSrc==='gemini'&&n===JOINTS){ s='gem'; key='mGem'; }
  else if(state.model==='failed'){ s='failed'; key='mFail'; }
  else if(state.model==='ready'){
    if(!state.ready){ s='ready'; key='mReady'; }
    else if(state.found||n>0){ s='found'; key='mFound'; }
    else { s='none'; key='mNone'; }
  }
  $('#mstat').dataset.s=s; $('#mstat-t').textContent=t(key);
  $('#save').disabled=!(state.ready&&n===JOINTS)||!!state.job;
  $('#auto').disabled=!state.ready||!!state.job||(state.model!=='ready'&&!GEM.key);
  $('#gemFrame').disabled=!state.ready||!!state.job;
  const live=$('#live');
  if(n===JOINTS){
    const m=metrics(state.pts.map(q=>({x:q.x*state.vw,y:q.y*state.vh})),curDir());
    live.innerHTML=[['m.lean',fx(m.lean,0),'°'],['m.thigh',fx(m.thigh,0),'°'],['m.knee',fx(m.knee,0),'°'],['m.shin',fx(m.shin,0),'°'],['m.ankle',fx(m.ankle,0),'°'],['m.foot',fx(m.footAhead,2),'']]
      .map(x=>'<div><dt>'+t(x[0])+'</dt><dd>'+x[1]+(x[2]?'<small>'+x[2]+'</small>':'')+'</dd></div>').join('');
  } else live.innerHTML='';
}
$('#undo').addEventListener('click',()=>{ state.pts.pop(); state.ptsSrc='manual'; draw(); updateUI(); });
$('#clear').addEventListener('click',()=>{ state.pts=[]; state.pts2=[]; state.ptsSrc=''; draw(); updateUI(); });

$('#save').addEventListener('click',()=>{
  if(state.pts.length<JOINTS||!state.ready) return;
  if(!video.paused) video.pause();
  const p=state.pts.map(q=>({x:q.x*state.vw,y:q.y*state.vh}));
  const tm=video.currentTime||0, saved=state.label;
  const p2=(state.pts2||[]).map(q=>({x:q.x*state.vw,y:q.y*state.vh}));
  state.poses.push({id:state.nextId++,label:saved,t:tm,p:p,p2:p2,m:metrics(p,curDir()),img:videoThumb(p,p2),demo:false,
    side:state.side==='left'?'L':state.side==='right'?'R':null,src:state.ptsSrc==='gemini'?'gemini':'manual'});
  state.poses.sort((a,b)=>a.t-b.t);
  state.coach=null;
  toast(t('toastSaved',t('lab.'+saved),fx(tm,3)));
  const ci=CYCLE.indexOf(saved);
  if(ci>=0){ state.label=CYCLE[(ci+1)%CYCLE.length]; setSeg('label',state.label); }
  draw(); updateUI(); renderKino(); renderReport();
});

/* ---------- kinogram ---------- */
function renderKino(){
  $('#kino-empty').hidden=state.poses.length>0;
  $('#kino-grid').innerHTML=state.poses.map(p=>{
    const lab=t('lab.'+p.label), src=p.demo?'demo':(p.src||'manual');
    return '<figure class="pose"><div class="imgwrap"><img alt="'+esc(t('poseAlt',lab,fx(p.t,3)))+'" src="'+p.img+'"><span class="tag">'+(p.demo?t('example')+' · ':'')+lab+(p.side?' · '+t('s'+p.side):'')+'</span>'+
    (src==='gemini'||src==='fused'?'<span class="src">✦ Gemini</span>':'')+'</div>'+
    '<figcaption><div class="row"><b class="num">'+fx(p.t,3)+' '+t('s')+'</b><button class="link" type="button" data-del="'+p.id+'">'+t('del')+'</button></div>'+
    '<dl class="mini"><div><dt>'+t('m.trunk')+'</dt><dd>'+fx(p.m.lean,0)+'°</dd></div><div><dt>'+t('m.thigh')+'</dt><dd>'+fx(p.m.thigh,0)+'°</dd></div><div><dt>'+t('m.knee')+'</dt><dd>'+fx(p.m.knee,0)+'°</dd></div><div><dt>'+t('m.ankle')+'</dt><dd>'+fx(p.m.ankle,0)+'°</dd></div><div><dt>'+t('m.foot')+'</dt><dd>'+fx(p.m.footAhead,2)+'</dd></div><div><dt>'+t('jointsBy')+'</dt><dd>'+t('src'+src)+'</dd></div></dl></figcaption></figure>';
  }).join('');
}
$('#kino-grid').addEventListener('click',e=>{
  const b=e.target.closest('[data-del]'); if(!b) return;
  const id=Number(b.dataset.del);
  state.poses=state.poses.filter(p=>p.id!==id); state.coach=null; renderKino(); renderReport();
});

/* ---------- rules and report ---------- */
function computePhase(){
  if(state.phaseMode!=='auto') return state.phaseMode;
  if(state.coach&&(state.coach.phase==='top'||state.coach.phase==='accel')) return state.coach.phase;
  const leans=state.poses.filter(p=>p.label==='Touchdown'||p.label==='Toe-off').map(p=>p.m.lean);
  return leans.length&&mean(leans)>20?'accel':'top';
}
function leanRule(phase){
  const top=phase==='top', k=top?'top':'acc';
  return {name:'r.lean.name',get:m=>m.lean,
    fmt:v=>v>=0?t('fwd',fx(v,0)):t('back',fx(Math.abs(v),0)),
    good:top?[0,12]:[25,50], ok:top?[-4,20]:[15,60], target:'r.lean.'+k+'.t',
    low:{cue:'r.lean.'+k+'.lo',drill:'r.lean.'+k+'.lod'}, high:{cue:'r.lean.'+k+'.hi',drill:'r.lean.hid'}};
}
function rulesFor(label,phase){
  if(label==='Touchdown') return [
    {name:'r.foot.name',get:m=>m.footAhead,
      fmt:v=>v>=0?t('r.foot.ahead',fx(v,2)):t('r.foot.behind',fx(Math.abs(v),2)),
      good:[-3,0.35],ok:[-3,0.6],target:'r.foot.t',
      high:{cue:'r.foot.hi',drill:'r.foot.hid'},low:{cue:'r.foot.lo',drill:'r.foot.lod'}},
    {name:'r.knee.name',get:m=>m.knee,fmt:v=>t('deg',fx(v,0)),good:[150,175],ok:[135,180],target:'r.knee.t',
      low:{cue:'r.knee.lo',drill:'r.knee.lod'},high:{cue:'r.knee.hi',drill:'r.knee.hid'}},
    {name:'r.ankle.name',get:m=>m.ankle,fmt:v=>t('deg',fx(v,0)),good:[75,105],ok:[65,115],target:'r.ankle.t',
      high:{cue:'r.ankle.hi',drill:'r.ankle.hid'},low:{cue:'r.ankle.lo',drill:'r.ankle.lod'}},
    leanRule(phase)
  ];
  if(label==='Toe-off') return [
    {name:'r.kext.name',get:m=>m.knee,fmt:v=>t('deg',fx(v,0)),good:[155,180],ok:[140,180],target:'r.kext.t',
      low:{cue:'r.kext.lo',drill:'r.kext.lod'},high:{cue:'outside',drill:null}},
    {name:'r.hext.name',get:m=>m.thigh,
      fmt:v=>v<0?t('r.hext.behind',fx(Math.abs(v),0)):t('r.hext.front',fx(v,0)),
      good:[-90,-10],ok:[-90,0],target:'r.hext.t',
      high:{cue:'r.hext.hi',drill:'r.hext.hid'},low:{cue:'outside',drill:null}},
    leanRule(phase)
  ];
  if(label==='Knee drive') return [
    {name:'r.klift.name',get:m=>m.thigh,fmt:v=>t('r.klift.fmt',fx(v,0)),good:[75,180],ok:[60,180],target:'r.klift.t',
      low:{cue:'r.klift.lo',drill:'r.klift.lod'},high:{cue:'outside',drill:null}},
    {name:'r.heel.name',get:m=>m.knee,fmt:v=>t('r.heel.fmt',fx(v,0)),good:[40,110],ok:[40,130],target:'r.heel.t',
      high:{cue:'r.heel.hi',drill:'r.heel.hid'},low:{cue:'outside',drill:null}},
    leanRule(phase)
  ];
  return [];
}
function rate(v,r){
  const within=a=>v>=a[0]&&v<=a[1];
  if(within(r.good)) return {status:'good'};
  return {status:within(r.ok)?'ok':'work',side:v<r.good[0]?'low':'high'};
}
function contactItems(phase){
  const tds=state.poses.filter(p=>p.label==='Touchdown'), tos=state.poses.filter(p=>p.label==='Toe-off');
  const lim=phase==='top'?{g:120,o:150}:{g:190,o:230};
  const out=[];
  const frameMs=1000/(state.fps*state.slow);
  tds.forEach(td=>{
    const to=tos.filter(x=>x.t>td.t&&(x.t-td.t)/state.slow<0.5&&(!td.side||!x.side||x.side===td.side)).sort((a,b)=>a.t-b.t)[0];
    let ms;
    if(td.contactMs) ms=td.contactMs;
    else if(to) ms=(to.t-td.t)*1000/state.slow;
    else return;
    out.push({name:t('r.contact.name')+(td.side?' · '+t('s'+td.side):''),ctx:to?t('r.contact.ctx',fx(td.t,3),fx(to.t,3)):'',
      value:t('r.contact.v',fx(ms,0)),target:t('r.contact.t',lim.g),
      status:ms<=lim.g?'good':ms<=lim.o?'ok':'work',
      cue:t('r.contact.cue'),drill:t('r.contact.drill'),
      note:frameMs>8?t('r.contact.note',fx(frameMs,0)):''});
  });
  const r=state.rhythm;
  if(r&&r.nL&&r.nR){
    const pctd=Math.abs(r.contactL-r.contactR)/((r.contactL+r.contactR)/2)*100;
    out.push({name:t('r.sym.name'),ctx:t('hRhythm'),value:t('r.sym.v',fx(r.contactL,0),fx(r.contactR,0),fx(pctd,0)),
      target:t('r.sym.t'),status:pctd<=8?'good':pctd<=15?'ok':'work',cue:t('r.sym.cue'),drill:t('r.sym.drill'),
      note:r.res>8?t('r.contact.note',fx(r.res,0)):''});
  }
  return out;
}
function evaluate(phase){
  const items=[];
  state.poses.forEach(p=>{
    rulesFor(p.label,phase).forEach(r=>{
      const v=r.get(p.m), res=rate(v,r), adv=res.side?r[res.side]:null;
      items.push({name:t(r.name),ctx:(p.demo?t('example')+' · ':'')+t('lab.'+p.label)+(p.side?' · '+t('s'+p.side):'')+' · '+fx(p.t,3)+' '+t('s'),
        value:r.fmt(v),target:t(r.target),status:res.status,
        cue:adv?t(adv.cue):'',drill:adv&&adv.drill?t(adv.drill):'',note:''});
    });
  });
  return items.concat(contactItems(phase));
}
function checkHTML(it){
  return '<article class="check"><header><h4>'+it.name+'</h4><span class="pill '+it.status+'">'+t('p'+it.status)+'</span></header>'+
    (it.ctx?'<p class="ctx">'+it.ctx+'</p>':'')+
    '<p><b class="num">'+it.value+'</b> · '+t('target')+' '+it.target+'</p>'+
    (it.status!=='good'?'<p class="cue">'+it.cue+'</p>'+(it.drill?'<p class="drill"><b>'+t('drills')+'</b> '+it.drill+'</p>':''):'')+
    (it.note?'<p class="drill">'+it.note+'</p>':'')+'</article>';
}
function renderRhythm(){
  const box=$('#rhythm'), r=state.rhythm;
  if(!r){ box.hidden=true; box.innerHTML=''; return; }
  const cells=[['rhSteps',String(r.steps),'']];
  if(r.contact) cells.push(['rhContact',fx(r.contact,0),t('ms')]);
  if(r.nL&&r.nR){ cells.push(['rhCL',fx(r.contactL,0),t('ms')]); cells.push(['rhCR',fx(r.contactR,0),t('ms')]); }
  if(r.flight) cells.push(['rhFlight',fx(r.flight,0),t('ms')]);
  if(r.rate) cells.push(['rhRate',fx(r.rate,2),t('perS')]);
  box.hidden=false;
  box.innerHTML='<h3>'+t('hRhythm')+'</h3><dl class="metrics">'+cells.map(c=>'<div><dt>'+t(c[0])+'</dt><dd>'+c[1]+(c[2]?'<small>'+c[2]+'</small>':'')+'</dd></div>').join('')+'</dl>'+
    '<p class="muted">'+t('rhNote',fx(r.res,0))+'</p>';
}
function renderReport(){
  const phase=computePhase(); state.phase=phase;
  $('#phase-auto').textContent=state.phaseMode==='auto'&&state.poses.length?t('phaseAutoIs',t(phase==='top'?'phTop':'phAcc')):'';
  renderCoach(); renderRhythm();
  const box=$('#report');
  const items=evaluate(phase);
  if(!items.length){
    box.innerHTML='<div class="empty-note"><p>'+t(state.poses.length?'reportOther':'reportEmpty')+'</p><button class="btn js-demo" type="button">'+t('demoBtn')+'</button></div>';
    return;
  }
  const good=items.filter(i=>i.status==='good').length;
  const groups=[['work','gWork'],['ok','gClose'],['good','gGood']];
  box.innerHTML='<div class="group">'+
    '<div class="summary"><span class="big num">'+t('ofN',good,items.length)+'</span><span>'+t('checksOk')+'</span></div>'+
    (state.poses.some(p=>p.demo)?'<p class="muted">'+t('reportDemo')+'</p>':'')+
    groups.map(g=>{
      const list=items.filter(i=>i.status===g[0]);
      return list.length?'<h3>'+t(g[1])+' ('+list.length+')</h3>'+list.map(checkHTML).join(''):'';
    }).join('')+
    '<p class="muted">'+t('reportAltis')+'</p></div>';
}

/* ---------- Gemini coach ---------- */
const COACH_SCHEMA={type:'OBJECT',properties:{
  headline:{type:'STRING'},
  summary:{type:'STRING'},
  phase:{type:'STRING',enum:['top','accel','unclear']},
  priorities:{type:'ARRAY',items:{type:'OBJECT',properties:{title:{type:'STRING'},why:{type:'STRING'},cue:{type:'STRING'},drills:{type:'STRING'}},required:['title','why','cue','drills']}},
  strengths:{type:'ARRAY',items:{type:'STRING'}},
  filming:{type:'STRING'},
  confidence:{type:'STRING',enum:['high','medium','low']}
},required:['headline','summary','phase','priorities','strengths','filming','confidence']};
async function askCoach(outer,doneMsg,doneTone){
  const scored=state.poses.filter(p=>CYCLE.indexOf(p.label)>=0);
  if(!GEM.key||!scored.length||state.coachBusy) return;
  const job=outer&&!outer.cancel?outer:{cancel:false,ctrl:new AbortController()};
  state.coachBusy=true; state.coachErr=''; renderCoach();
  if(outer) setProg(t('pCoach'),null);
  const lang=state.lang, phase=computePhase();
  const r1=v=>Math.round(v*10)/10;
  const data={
    phaseSetting:state.phaseMode==='auto'?'auto ('+phase+')':phase,
    frameRate:state.fps, slowMotionFactor:state.slow,
    keyFrames:scored.map(p=>({id:p.id,label:p.label,leg:p.side||'unknown',timeSeconds:r1(p.t),jointsFrom:p.demo?'example':p.src,
      anglesDeg:{trunkLeanForward:r1(p.m.lean),thighFromVertical:r1(p.m.thigh),kneeInterior:r1(p.m.knee),shinFromVertical:r1(p.m.shin),ankleInterior:r1(p.m.ankle)},
      footAheadOfHipInThighLengths:Math.round(p.m.footAhead*100)/100})),
    checks:evaluate(phase).map(i=>({check:i.name,where:i.ctx,value:i.value,target:i.target,status:i.status})),
    rhythm:state.rhythm?{steps:state.rhythm.steps,contactMsAvg:Math.round(state.rhythm.contact),contactMsLeft:Math.round(state.rhythm.contactL)||null,contactMsRight:Math.round(state.rhythm.contactR)||null,flightMsAvg:Math.round(state.rhythm.flight),stepsPerSecond:r1(state.rhythm.rate)}:null
  };
  const prompt='You are an experienced sprint coach who uses the ALTIS kinogram method. Below are angles measured from joint points on key frames of a side-view sprint video, the automatic checks, and the rhythm data. The attached images are the kinogram frames with the joint skeleton drawn in gold, in the same order as keyFrames.\n'+
    'Write a short coaching report in '+(lang==='ru'?'Russian':'English')+'. Rules:\n'+
    '- headline: one sentence, the single most important takeaway.\n- summary: 2 to 3 sentences.\n'+
    '- priorities: at most 3, most important first. Each with a short title, why it matters (cite the numbers), one simple cue, and 2 to 3 drills.\n'+
    '- Look for root causes (mobility, strength, posture) rather than only repeating cues. Avoid cues that force full extension or clawing. Compare left and right legs when both are present.\n'+
    '- strengths: 1 to 3 things that already look good.\n'+
    '- filming: one sentence on video quality. If a skeleton in an image is clearly not on the athlete\'s joints, say which frame so the user can drag the points.\n'+
    '- phase: whether this looks like top speed or acceleration.\n- Plain words, no markdown.\n\nDATA:\n'+JSON.stringify(data);
  const parts=[{text:prompt}];
  scored.slice(0,6).forEach(p=>{ parts.push({text:'Frame id '+p.id+': '+p.label+(p.side?' ('+p.side+')':'')}); parts.push({inlineData:{mimeType:'image/jpeg',data:p.img.split(',')[1]}}); });
  try{
    const r=await gemini(parts,COACH_SCHEMA,job.ctrl.signal);
    r.lang=lang; r.model=GEM.model;
    state.coach=r;
  }catch(e){
    if(!(job.cancel||e.name==='AbortError')) state.coachErr=e.message;
  }finally{
    state.coachBusy=false; renderReport();
    if(outer&&doneMsg){ setProg(doneMsg,1,doneTone); hideProgIfDone(); }
  }
}
function hideProgIfDone(){ const p=$('#prog'); if(p.dataset.tone==='good') setTimeout(()=>{ if(!state.job&&$('#prog').dataset.tone==='good') hideProg(); },4000); }
function renderCoach(){
  const box=$('#coach');
  const scored=state.poses.filter(p=>CYCLE.indexOf(p.label)>=0);
  if(!scored.length&&!state.coach){ box.hidden=true; box.innerHTML=''; return; }
  box.hidden=false;
  let h='<h3>'+t('hCoach')+'</h3>';
  const c=state.coach;
  if(state.coachBusy){
    h+='<p class="muted">'+t('cBusy')+'</p><div class="track ind"><i></i></div>';
  } else if(c){
    h+='<p class="quote">'+esc(c.headline)+'</p><p>'+esc(c.summary)+'</p>';
    if(c.priorities&&c.priorities.length){
      h+='<div class="lbl">'+t('cPri')+'</div><ol>'+c.priorities.slice(0,3).map(p=>'<li><b>'+esc(p.title)+'</b><p>'+esc(p.why)+'</p><p><span class="lbl">'+t('cCue')+'</span> '+esc(p.cue)+'</p><p class="muted"><span class="lbl">'+t('cDrills')+'</span> '+esc(p.drills)+'</p></li>').join('')+'</ol>';
    }
    if(c.strengths&&c.strengths.length) h+='<div class="lbl">'+t('cStr')+'</div><ul>'+c.strengths.slice(0,3).map(s=>'<li>'+esc(s)+'</li>').join('')+'</ul>';
    if(c.filming) h+='<div class="lbl">'+t('cFilm')+'</div><p class="muted">'+esc(c.filming)+'</p>';
    h+='<p class="muted">'+t('cConf',t('conf'+(c.confidence||'medium')))+' · '+esc(c.model)+' · '+t('cAi')+'</p>';
    if(c.lang!==state.lang) h+='<p class="muted">'+t('cLang')+'</p>';
    h+='<div class="row"><button class="btn" type="button" id="coach-go">'+t('coachAgain')+'</button></div>';
  } else {
    h+='<p class="muted">'+t('coachIntro')+'</p>';
    if(state.coachErr) h+='<p class="err">'+esc(t('gBad',state.coachErr))+'</p>';
    h+=GEM.key?'<div class="row"><button class="btn gold" type="button" id="coach-go">✦ '+t('coachBtn')+'</button></div>'
      :'<p class="muted">'+t('gNoKey')+'</p>';
  }
  box.innerHTML=h;
  const go=$('#coach-go'); if(go) go.addEventListener('click',()=>askCoach(null));
}

/* ---------- example data ---------- */
function loadDemo(){
  const vw=600, vh=800, GROUND=572;
  const defs=[
    {label:'Touchdown',t:1.25,p:[[300,170],[292,330],[330,440],[352,560],[380,568]]},
    {label:'Toe-off',t:1.34,p:[[310,175],[290,335],[262,455],[225,562],[205,575]]},
    {label:'Knee drive',t:1.45,p:[[305,170],[298,330],[385,320],[325,415],[345,440]]}
  ];
  state.poses=defs.map(d=>{
    const p=d.p.map(a=>({x:a[0],y:a[1]}));
    const img=thumb(p,vw,vh,(g,c)=>{
      const gr=g.createLinearGradient(0,0,0,TH); gr.addColorStop(0,'#211D17'); gr.addColorStop(1,'#110F0C');
      g.fillStyle=gr; g.fillRect(0,0,TW,TH);
      const s=TW/c.w, gy=(GROUND-c.y)*s;
      g.fillStyle='#2B261E'; g.fillRect(0,gy,TW,TH-gy);
      g.fillStyle='#6F5B36'; g.fillRect(0,gy,TW,2);
    });
    return {id:state.nextId++,label:d.label,t:d.t,m:metrics(p,1),img:img,demo:true,side:null,src:'demo'};
  });
  state.poses.sort((a,b)=>a.t-b.t);
  state.coach=null; state.coachErr='';
  renderKino(); renderReport();
  toast(t('toastDemo'));
}
document.addEventListener('click',e=>{ if(e.target.closest('.js-demo')) loadDemo(); });

/* ---------- start ---------- */
let startLang='en';
try{
  const saved=localStorage.getItem('stridelab-lang');
  if(saved==='ru'||saved==='en') startLang=saved;
  else if(((navigator.languages&&navigator.languages[0])||navigator.language||'').slice(0,2)==='ru') startLang='ru';
}catch(e){}
if(!GEM.key) $('#gem-box').open=true;
setLang(startLang);
loadModel();
})();
